<!doctype html><meta charset=utf-8><style>body{margin:0;background:#0d0d12;display:grid;place-items:center;height:100vh}canvas{width:720px;height:720px}</style><canvas id=c width=1440 height=1440></canvas>
<script src="node_modules/flubber/build/flubber.min.js"></script><script>
const star=(n,R,r)=>Array.from({length:n*2},(_,i)=>{const a=i*Math.PI/n-Math.PI/2,q=i%2?r:R;return[720+q*Math.cos(a),720+q*Math.sin(a)]});
const circ=Array.from({length:64},(_,i)=>{const a=i/64*Math.PI*2;return[720+420*Math.cos(a),720+420*Math.sin(a)]});
const heart=Array.from({length:80},(_,i)=>{const t=i/80*Math.PI*2;return[720+26*16*Math.pow(Math.sin(t),3),680-26*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))]});
const blob=Array.from({length:60},(_,i)=>{const a=i/60*Math.PI*2,r=380+70*Math.sin(a*3)+40*Math.cos(a*5);return[720+r*Math.cos(a),720+r*Math.sin(a)]});
const sq=[[320,320],[1120,320],[1120,1120],[320,1120]];
const shapes=[star(5,470,200),circ,heart,blob,sq,star(5,470,200)],cols=['#ff5d8f','#ffd166','#ef476f','#06d6a0','#4cc9f0','#ff5d8f'];
const ips=shapes.slice(0,-1).map((s,i)=>flubber.interpolate(s,shapes[i+1],{maxSegmentLength:8}));
const ctx=c.getContext('2d');const lerp=(a,b,t)=>{const p=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16));const A=p(a),B=p(b);return`rgb(${A.map((v,i)=>v+(B[i]-v)*t).join()})`};
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
window.draw=T=>{const seg=1.4,k=Math.min(ips.length-1,Math.floor(T/seg)),t=ease(Math.min(1,(T-k*seg)/(seg*0.7)));
ctx.fillStyle='#0d0d12';ctx.fillRect(0,0,1440,1440);const g=ctx.createRadialGradient(600,560,50,720,720,700);g.addColorStop(0,'#fff8');g.addColorStop(1,lerp(cols[k],cols[k+1],t));
ctx.fillStyle=g;ctx.shadowColor=lerp(cols[k],cols[k+1],t);ctx.shadowBlur=120;ctx.fill(new Path2D(ips[k](t)));ctx.shadowBlur=0;
ctx.fillStyle='#fff';ctx.font='bold 64px sans-serif';ctx.fillText('flubber morph',60,1380)};
let t0=performance.now();(function f(){draw((performance.now()-t0)/1000%7);requestAnimationFrame(f)})();window.DONE=1;
</script>
