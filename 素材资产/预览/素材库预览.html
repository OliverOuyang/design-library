<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>设计积累 · 本地素材预览</title><style>
:root{--ink:#1b1a18;--paper:#f7f4ee;--card:#fffdf9;--line:#ddd5c8;--accent:#bd4f2c;--muted:#706b63;--blue:#3f6474}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:15px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}header{max-width:1240px;padding:52px 28px 24px;margin:auto;display:grid;gap:20px}.eyebrow{color:var(--accent);letter-spacing:.12em;font-size:12px;font-weight:700;text-transform:uppercase}h1{font:clamp(34px,5vw,64px)/.98 Georgia,"Songti SC",serif;max-width:760px;margin:0;letter-spacing:-.04em}.intro{color:var(--muted);max-width:680px;margin:0;font-size:17px}.toolbar{max-width:1240px;padding:0 28px 32px;margin:auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid var(--line)}button,input{font:inherit}button{cursor:pointer;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 13px}button[aria-pressed="true"]{color:#fff;background:var(--ink);border-color:var(--ink)}input{min-width:220px;flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}main{max-width:1240px;padding:34px 28px 80px;margin:auto}.count{color:var(--muted);margin:0 0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.card{display:grid;grid-template-rows:164px auto;min-height:280px;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 0 rgba(50,40,20,.05)}.card[hidden]{display:none}.stage{position:relative;display:grid;place-items:center;overflow:hidden;background:#e5e9e0}.audio-stage{background:linear-gradient(135deg,#2b2a27,#4b4850);color:#fff}.audio-stage:after{content:"";width:180px;height:180px;position:absolute;border:1px solid rgba(255,255,255,.18);border-radius:50%}audio{position:relative;z-index:1;width:88%}iframe{width:100%;height:100%;border:0;background:#e5e9e0}.meta{padding:15px}.kind{color:var(--accent);font-size:12px;font-weight:700}h2{margin:4px 0 7px;font-size:17px}p{margin:0}.note{color:var(--muted);font-size:13px}.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}.tag{color:var(--blue);background:#edf1ef;border-radius:999px;padding:2px 7px;font-size:11px}@media(max-width:560px){header,main,.toolbar{padding-left:18px;padding-right:18px}h1{font-size:38px}}
</style></head><body>
<header><div class="eyebrow">Design accumulation · local assets</div><h1>先看见节奏，再决定是否采用。</h1><p class="intro">离线种子素材库。分类、数量、文件路径与预览全部由同一份 Manifest 生成；所有音效均为本地 WAV，所有 motion 都是可单独打开的本地 HTML。</p></header>
<nav class="toolbar" id="filters" aria-label="素材分类筛选"><button data-filter="all" aria-pressed="true">全部</button><label for="search" class="sr-only">搜索素材</label><input id="search" type="search" aria-label="搜索素材" placeholder="搜索名称、气质或用途"></nav><main><p class="count" id="count"></p><section class="grid" id="grid" aria-live="polite"></section></main>
<script src="../assets-manifest.js"></script><script>
const manifest=window.ASSET_MANIFEST;const categoryById=Object.fromEntries(manifest.categories.map(x=>[x.id,x.label]));const root="../";const filters=document.querySelector('#filters');manifest.categories.forEach(c=>{const b=document.createElement('button');b.dataset.filter=c.id;b.textContent=c.label;filters.querySelector('label').before(b)});const grid=document.querySelector('#grid');const search=document.querySelector('#search');let active='all';
function render(){const q=search.value.toLowerCase().trim();let visible=0;grid.innerHTML=manifest.items.map(x=>{const all=`${x.name} ${categoryById[x.category]} ${x.note} ${x.tags.join(' ')}`.toLowerCase();const match=(active==='all'||x.category===active)&&all.includes(q);if(match)visible++;const stage=x.kind==='audio'?`<div class="stage audio-stage"><audio controls preload="metadata" src="${root+x.path}">你的浏览器不能播放 WAV。</audio></div>`:`<div class="stage"><iframe src="${root+x.path}" title="${x.name} motion 预览" loading="lazy"></iframe></div>`;return `<article class="card" data-id="${x.id}" ${match?'':'hidden'}>${stage}<div class="meta"><div class="kind">${x.kind==='audio'?'CC0 音效':'本库原创 CSS motion'} · ${categoryById[x.category]}</div><h2>${x.name}</h2><p class="note">${x.note}</p><div class="tags">${x.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div></article>`}).join('');const counts=manifest.categories.map(c=>manifest.items.filter(x=>x.category===c.id).length);document.querySelector('#count').textContent=`显示 ${visible} / ${manifest.items.length} 项 · ${manifest.categories.length} 个最小分类：${counts.join(' / ')} 项`}
filters.addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;active=b.dataset.filter;filters.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()});search.addEventListener('input',render);render();
</script></body></html>
