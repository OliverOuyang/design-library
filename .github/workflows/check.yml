name: 素材校验

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 风格与素材库 catalog.json
        run: python3 06_风格与素材库/tools/check-catalog.py 06_风格与素材库
      - name: 素材资产 assets-manifest.js
        run: python3 素材资产/check-assets.py
